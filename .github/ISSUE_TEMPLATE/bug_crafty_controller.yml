name: "Bug: Crafty Controller"
description: Something in Crafty Controller isn't working as it should.
labels: [bug, crafty_controller]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Home Assistant (Settings → About) and this integration ("version" in custom_components/crafty_controller/manifest.json).
      placeholder: Home Assistant 2026.9.4, Crafty Controller 4.x, integration 1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, if you know them.
  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Setup (URL, token, SSL)
        - The on/off switch
        - The status sensor
        - Servers missing or unavailable
        - Something else
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings → System → Logs, search for crafty_controller. Remove anything private before pasting.
      render: text
